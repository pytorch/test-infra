name: TD scorer refit

on:
  schedule:
    # Daily, after the day's test times and TD file ratings updates.
    - cron: "17 13 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/torchci/td/scorer/**"
      - ".github/workflows/td-scorer.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refit:
    runs-on: ubuntu-latest
    # The AWS credentials below last role-duration-seconds from their step; the job must
    # end before them (the backfill budget is store.BACKFILL_SECONDS).
    timeout-minutes: 285
    # TEMPORARY (PR test): the S3 role trusts this environment.
    environment: trigger-nightly
    permissions:
      contents: read
      id-token: write
    outputs:
      ran: ${{ steps.refit.outputs.ran }}
    steps:
      - name: Checkout test-infra
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install -r tools/torchci/requirements.txt
          python -m pip install -e tools/torchci

      # The role trusts this repository's refs/heads/main OIDC subject; a job
      # environment would change the subject.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@50ac8dd1e1b10d09dac7b8727528b91bed831ac0 # v3.0.2
        with:
          role-to-assume: arn:aws:iam::308535385114:role/upload_to_ossci_raw_job_status
          aws-region: us-east-1
          role-duration-seconds: 18000

      - name: Refit, gate and write the model
        id: refit
        working-directory: tools
        env:
          CLICKHOUSE_ENDPOINT: ${{ secrets.CLICKHOUSE_HUD_USER_URL }}
          CLICKHOUSE_USERNAME: ${{ secrets.CLICKHOUSE_HUD_USER_USERNAME }}
          CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_HUD_USER_PASSWORD }}
          ON_MAIN: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          if [ -z "${CLICKHOUSE_ENDPOINT}" ]; then
            if [ "${ON_MAIN}" = "true" ]; then
              echo "::error::No ClickHouse credentials on main"
              exit 1
            fi
            echo "No ClickHouse credentials (a fork pull request): skipping the refit"
            echo "ran=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "ran=true" >> "${GITHUB_OUTPUT}"
          mkdir -p ../td-scorer
          outputs=(--out ../td-scorer/td-scorer.json
                   --report ../td-scorer/report.json
                   --sample ../td-scorer/sample.json)
          if [ "${ON_MAIN}" = "true" ]; then
            python -m torchci.td.scorer refit --s3 "${outputs[@]}"
          else
            # TEMPORARY (PR test): the main path (S3, every day, the backfill budget)
            # under a test prefix, never the production one; the gate decides as on main.
            python - "${outputs[@]}" <<'PY'
          import sys
          from torchci.td.scorer import __main__ as m, holdout, store
          prefix = "td_scorer/pr-test-9427/"
          rows = f"{prefix}rows/{store.SHARD_FORMAT}/"
          store.S3_PREFIX = rows
          m._store.__defaults__ = (rows, "")
          holdout.HOLDOUT_PREFIX = f"{prefix}holdout/"
          assert m._store.__defaults__[0].startswith(prefix)
          assert holdout.HOLDOUT_PREFIX.startswith(prefix)
          print(f"S3 prefixes: {rows} and {holdout.HOLDOUT_PREFIX}")
          sys.exit(m.main(["refit", "--s3", *sys.argv[1:]]))
          PY
          fi

      - name: Upload the model
        if: always() && steps.refit.outputs.ran == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: td-scorer
          path: td-scorer/
          if-no-files-found: ignore

  # pytorch's validator and evaluator run in their own job, away from the AWS role and
  # the ClickHouse secrets.
  check:
    needs: refit
    if: needs.refit.outputs.ran == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      validated: ${{ steps.check.outputs.validated }}
    steps:
      - name: Checkout test-infra
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # scorer_model.py is standard library only; scorer.py's select_tests (the cut
      # replay) imports from tools/testing and tools/stats.
      - name: Checkout pytorch's TD scorer from pytorch main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: pytorch/pytorch
          # TEMPORARY (PR test): pytorch main has no scorer code yet.
          ref: nm/305/2
          path: pytorch
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            tools/testing
            tools/stats

      - name: Set up python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install -r tools/torchci/requirements.txt
          python -m pip install -e tools/torchci

      - name: Download the model
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: td-scorer
          path: td-scorer

      # check-pytorch exits 3 when pytorch main lacks the TD scorer code: nothing was
      # validated, so nothing publishes.
      - name: Validate with pytorch, compare p and r, replay the cut
        id: check
        working-directory: tools
        run: |
          set +e
          python -m torchci.td.scorer check-pytorch \
            --model ../td-scorer/td-scorer.json \
            --sample ../td-scorer/sample.json \
            --pytorch-root ../pytorch
          code=$?
          set -e
          if [ "${code}" -eq 0 ]; then
            echo "validated=true" >> "${GITHUB_OUTPUT}"
          elif [ "${code}" -eq 3 ]; then
            echo "validated=false" >> "${GITHUB_OUTPUT}"
          else
            exit "${code}"
          fi

  publish:
    needs: [refit, check]
    # TEMPORARY (PR test): runs on pull requests and really publishes.
    if: needs.check.outputs.validated == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download the model
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: td-scorer
          path: td-scorer

      - name: Checkout generated-stats branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: generated-stats
          path: generated-stats
          fetch-depth: 1

      - name: Push stats/td-scorer.json to generated-stats
        working-directory: generated-stats
        run: |
          git config user.name "Pytorch Test Infra"
          git config user.email "test-infra@pytorch.org"
          # Other workflows push to generated-stats too: rebuild the commit on the latest tip
          # and retry when a push fails, e.g. because one of them pushed first.
          for attempt in 1 2 3 4 5; do
            if [ "${attempt}" -gt 1 ]; then
              sleep $((attempt * 15))
            fi
            if ! git fetch --depth=1 origin generated-stats; then
              continue
            fi
            git reset --hard FETCH_HEAD
            # enabled: false is the scorer's off switch; only a file that is absent or
            # enabled is replaced.
            if [ -f stats/td-scorer.json ]; then
              enabled=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1])).get("enabled") is True)' stats/td-scorer.json)
              if [ "${enabled}" != "True" ]; then
                echo "stats/td-scorer.json is not enabled: leaving it in place"
                exit 0
              fi
            fi
            cp ../td-scorer/td-scorer.json stats/td-scorer.json
            git add stats/td-scorer.json
            if git diff --cached --quiet; then
              echo "No changes to push"
              exit 0
            fi
            git commit -m "Updating the TD scorer model"
            if git push origin HEAD:generated-stats; then
              exit 0
            fi
          done
          echo "Failed to push to generated-stats after 5 attempts"
          exit 1
