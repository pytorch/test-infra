name: TD scorer refit

on:
  schedule:
    # Daily, after the day's test times and TD file ratings updates.
    - cron: "17 13 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/torchci/td/scorer/**"
      - ".github/workflows/td-scorer.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refit:
    runs-on: ubuntu-latest
    # The AWS credentials below last role-duration-seconds from their step; the job must
    # end before them (the backfill budget is store.BACKFILL_SECONDS).
    timeout-minutes: 285
    # TEMPORARY (end-to-end test on #9483): the S3 role trusts this environment, whose
    # deployment branches are main and refs/pull/9483/merge.
    environment: trigger-nightly
    permissions:
      contents: read
      id-token: write
    outputs:
      ran: ${{ steps.refit.outputs.ran }}
    steps:
      - name: Checkout test-infra
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install -r tools/torchci/requirements.txt
          python -m pip install -e tools/torchci

      # The role trusts this repository's refs/heads/main OIDC subject; a job
      # environment would change the subject.
      - name: Configure AWS credentials
        # TEMPORARY (end-to-end test): also on #9483's own pull request runs.
        if: >-
          (github.ref == 'refs/heads/main' && github.event_name != 'pull_request')
          || github.event.pull_request.number == 9483
        uses: aws-actions/configure-aws-credentials@50ac8dd1e1b10d09dac7b8727528b91bed831ac0 # v3.0.2
        with:
          role-to-assume: arn:aws:iam::308535385114:role/upload_to_ossci_raw_job_status
          aws-region: us-east-1
          role-duration-seconds: 18000

      - name: Refit, gate and write the model
        id: refit
        working-directory: tools
        env:
          CLICKHOUSE_ENDPOINT: ${{ secrets.CLICKHOUSE_HUD_USER_URL }}
          CLICKHOUSE_USERNAME: ${{ secrets.CLICKHOUSE_HUD_USER_USERNAME }}
          CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_HUD_USER_PASSWORD }}
          ON_MAIN: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          # TEMPORARY (end-to-end test): #9483's own pull request runs only.
          E2E: ${{ github.event.pull_request.number == 9483 }}
          # The test budget is opt-in: refit gets --budget only when this repository
          # variable is "on" (model_json.budget_on).
          TD_SCORER_BUDGET: ${{ vars.TD_SCORER_BUDGET }}
        run: |
          set -euo pipefail
          if [ -z "${CLICKHOUSE_ENDPOINT}" ]; then
            if [ "${ON_MAIN}" = "true" ]; then
              echo "::error::No ClickHouse credentials on main"
              exit 1
            fi
            echo "No ClickHouse credentials (a fork pull request): skipping the refit"
            echo "ran=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "ran=true" >> "${GITHUB_OUTPUT}"
          mkdir -p ../td-scorer
          outputs=(--out ../td-scorer/td-scorer.json
                   --report ../td-scorer/report.json
                   --sample ../td-scorer/sample.json
                   --budget-out ../td-scorer/td-scorer-budget.json
                   --budget-sample ../td-scorer/budget-sample.json)
          budget=off
          if python -c 'import os, sys
          from torchci.td.scorer.model_json import budget_on
          sys.exit(0 if budget_on(os.environ.get("TD_SCORER_BUDGET")) else 1)'; then
            budget=on
            outputs+=(--budget)
          fi
          echo "budget=${budget}" >> "${GITHUB_OUTPUT}"
          echo "TD scorer budget: ${budget}"
          if [ "${ON_MAIN}" = "true" ]; then
            python -m torchci.td.scorer refit --s3 "${outputs[@]}"
          elif [ "${E2E}" = "true" ]; then
            # TEMPORARY (end-to-end test): the main path on S3 under the test prefix
            # #305's test filled, never the production one, with the budget forced on.
            python - "${outputs[@]}" --budget <<'PY'
          import sys
          from torchci.td.scorer import __main__ as m, holdout, store
          prefix = "td_scorer/pr-test-9427/"
          rows = f"{prefix}rows/{store.SHARD_FORMAT}/"
          real_init = store.S3Store.__init__
          def guarded_init(self, *args, **kwargs):
              real_init(self, *args, **kwargs)
              if not self.prefix.startswith(prefix):
                  raise RuntimeError(f"S3 prefix {self.prefix} is not under {prefix}")
          store.S3Store.__init__ = guarded_init
          store.S3_PREFIX = rows
          m._store.__defaults__ = (rows, "")
          holdout.HOLDOUT_PREFIX = f"{prefix}holdout/"
          print(f"S3 prefixes: {rows} and {holdout.HOLDOUT_PREFIX}")
          sys.exit(m.main(["refit", "--s3", *sys.argv[1:]]))
          PY
          else
            # Three days in memory: no S3, no publish, and the gate only reports.
            python -m torchci.td.scorer refit --train-days 2 --gate-days 1 \
              --report-only "${outputs[@]}"
          fi

      - name: Summarise the budget
        if: always() && steps.refit.outputs.ran == 'true'
        working-directory: tools
        env:
          BUDGET: ${{ steps.refit.outputs.budget }}
        run: |
          python - <<'PY' >> "${GITHUB_STEP_SUMMARY}"
          import json, os
          from pathlib import Path
          path = Path("../td-scorer/report.json")
          report = json.loads(path.read_text()) if path.exists() else {}
          budget = report.get("budget")
          print(f"TD scorer budget mode: {os.environ.get('BUDGET') or 'unknown'}")
          if budget:
              kept = "kept" if report.get("budget_kept") else "dropped"
              print(
                  f"- block {budget['block']} {kept}; realised mean share of test-times"
                  f" seconds {budget['seconds_share']:.3f}, of cost"
                  f" {budget['cost_share']:.3f}; per-PR retention"
                  f" {budget['retention']:.3f} ({budget['kept']} of {budget['prs']})"
              )
          else:
              print("- no budget block: the scorer's cut spends what TD's cut costs")
          PY

      - name: Upload the model
        if: always() && steps.refit.outputs.ran == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: td-scorer
          path: td-scorer/
          if-no-files-found: ignore

  # pytorch's validator and evaluator run in their own job, away from the AWS role and
  # the ClickHouse secrets.
  check:
    needs: refit
    if: needs.refit.outputs.ran == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      validated: ${{ steps.check.outputs.validated }}
      budget_validated: ${{ steps.check.outputs.budget_validated }}
    steps:
      - name: Checkout test-infra
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # scorer_model.py is standard library only; scorer.py's select_tests (the cut
      # replay) imports from tools/testing and tools/stats.
      - name: Checkout pytorch's TD scorer from pytorch main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: pytorch/pytorch
          # TEMPORARY (end-to-end test): #9483 checks against pytorch's budget branch.
          ref: ${{ github.event.pull_request.number == 9483 && 'nm/322/1' || 'main' }}
          path: pytorch
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            tools/testing
            tools/stats

      - name: Set up python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install -r tools/torchci/requirements.txt
          python -m pip install -e tools/torchci

      - name: Download the model
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: td-scorer
          path: td-scorer

      # check-pytorch exits 3 when pytorch main lacks the TD scorer code: nothing was
      # validated, so nothing publishes. td-scorer-budget.json is checked too, but its
      # result never fails this job: any exit but 0 only keeps its model from publishing.
      - name: Validate with pytorch, compare p and r, replay the cut
        id: check
        working-directory: tools
        run: |
          check() {
            python -m torchci.td.scorer check-pytorch --model "../td-scorer/$1" \
              --sample "../td-scorer/$2" --pytorch-root ../pytorch
          }
          set +e
          check td-scorer.json sample.json
          code=$?
          check td-scorer-budget.json budget-sample.json
          budget_code=$?
          set -e
          if [ "${budget_code}" -eq 0 ]; then
            echo "budget_validated=true" >> "${GITHUB_OUTPUT}"
          else
            echo "budget_validated=false" >> "${GITHUB_OUTPUT}"
            message="td-scorer-budget.json did not validate (check-pytorch exited ${budget_code}): its model does not publish"
            echo "::warning::${message}"
            echo "${message}" >> "${GITHUB_STEP_SUMMARY}"
          fi
          if [ "${code}" -eq 0 ]; then
            echo "validated=true" >> "${GITHUB_OUTPUT}"
          elif [ "${code}" -eq 3 ]; then
            echo "validated=false" >> "${GITHUB_OUTPUT}"
          else
            exit "${code}"
          fi

  publish:
    needs: [refit, check]
    # TEMPORARY (end-to-end test): also on #9483's own pull request runs, which publish
    # stats/td-scorer-budget.json only (guarded below).
    if: >-
      ((github.ref == 'refs/heads/main' && github.event_name != 'pull_request')
      || github.event.pull_request.number == 9483)
      && needs.check.outputs.validated == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download the model
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: td-scorer
          path: td-scorer

      # Fails closed. td-scorer.json never carries a budget block. td-scorer-budget.json
      # keeps the refit's budget model only when check-pytorch validated it and, if it
      # has a budget block, the repository variable is "on", normalised as
      # model_json.budget_on does (trim ASCII whitespace, lowercase) without running
      # repository code here; otherwise it gets td-scorer.json's model, and the last
      # step fails the job after the push.
      - name: Choose the models to publish
        id: choose
        env:
          TD_SCORER_BUDGET: ${{ vars.TD_SCORER_BUDGET }}
          BUDGET_VALIDATED: ${{ needs.check.outputs.budget_validated }}
          # TEMPORARY (end-to-end test): the budget file's block is allowed on #9483 only.
          E2E: ${{ github.event.pull_request.number == 9483 }}
          LC_ALL: C
        run: |
          set -euo pipefail
          has_block() {
            python3 -I -c 'import json, sys; print("budget" in json.load(open(sys.argv[1])))' "$1"
          }
          plain_block=$(has_block td-scorer/td-scorer.json)
          if [ "${plain_block}" != "False" ]; then
            echo "::error::td-scorer.json has a budget block: not publishing"
            exit 1
          fi
          value="${TD_SCORER_BUDGET}"
          value="${value#"${value%%[![:space:]]*}"}"
          value="${value%"${value##*[![:space:]]}"}"
          value="${value,,}"
          if [ "${E2E:-}" = "true" ]; then
            value=on
          fi
          mode=$([ "${value}" = "on" ] && echo on || echo off)
          budget_block=$(has_block td-scorer/td-scorer-budget.json || true)
          refused=""
          if [ "${BUDGET_VALIDATED}" != "true" ]; then
            refused="td-scorer-budget.json did not validate with pytorch"
          elif [ "${budget_block}" = "True" ] && [ "${mode}" != "on" ]; then
            refused="td-scorer-budget.json has a budget block but TD_SCORER_BUDGET is not on"
          elif [ "${budget_block}" != "True" ] && [ "${budget_block}" != "False" ]; then
            refused="td-scorer-budget.json is not valid JSON"
          fi
          echo "TD scorer budget mode: ${mode}; td-scorer-budget.json has a budget block: ${budget_block:-unknown}" | tee -a "${GITHUB_STEP_SUMMARY}"
          if [ -n "${refused}" ]; then
            cp td-scorer/td-scorer.json td-scorer/td-scorer-budget.json
            echo "refused=${refused}" >> "${GITHUB_OUTPUT}"
            echo "${refused}: publishing td-scorer.json's model under its name" | tee -a "${GITHUB_STEP_SUMMARY}"
          fi

      # TEMPORARY (end-to-end test): publish only a budget model built today, with its
      # block, that validated; anything else fails before the push.
      - name: Guard the end-to-end publish
        if: github.event.pull_request.number == 9483
        env:
          REFUSED: ${{ steps.choose.outputs.refused }}
        run: |
          set -euo pipefail
          if [ -n "${REFUSED}" ]; then
            echo "::error::${REFUSED}"
            exit 1
          fi
          python3 - <<'PY'
          import datetime, json, sys
          model = json.load(open("td-scorer/td-scorer-budget.json"))
          today = datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          if "budget" not in model or model["version"] != today:
              sys.exit(f"budget block {'budget' in model}, version {model['version']} != {today}")
          print(f"publishing td-scorer-budget.json {model['version']}: {model['budget']}")
          PY

      - name: Checkout generated-stats branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: generated-stats
          path: generated-stats
          fetch-depth: 1

      - name: Push the models to generated-stats
        working-directory: generated-stats
        env:
          # TEMPORARY (end-to-end test): #9483 writes td-scorer-budget.json only.
          E2E: ${{ github.event.pull_request.number == 9483 }}
        run: |
          git config user.name "Pytorch Test Infra"
          git config user.email "test-infra@pytorch.org"
          enabled() {
            python3 -I -c 'import json, sys; print(json.load(open(sys.argv[1])).get("enabled") is True)' "$1"
          }
          version() {
            python3 -I -c 'import json, sys; print(json.load(open(sys.argv[1])).get("version", ""))' "$1"
          }
          # Other workflows push to generated-stats too: rebuild the commit on the latest tip
          # and retry when a push fails, e.g. because one of them pushed first.
          for attempt in 1 2 3 4 5; do
            if [ "${attempt}" -gt 1 ]; then
              sleep $((attempt * 15))
            fi
            if ! git fetch --depth=1 origin generated-stats; then
              continue
            fi
            git reset --hard FETCH_HEAD
            # enabled: false is an off switch; only a file that is absent or enabled is
            # replaced. td-scorer.json's flag turns the scorer off for every checkout, so
            # while it is off td-scorer-budget.json is not written either. A live file
            # with a later version (a re-run of an older run) is left in place too.
            for name in td-scorer.json td-scorer-budget.json; do
              if [ -f "stats/${name}" ] && [ "$(enabled "stats/${name}")" != "True" ]; then
                echo "stats/${name} is not enabled: leaving it in place"
                if [ "${name}" = "td-scorer.json" ]; then
                  echo "Not writing stats/td-scorer-budget.json either"
                  break
                fi
                continue
              fi
              if [ -f "stats/${name}" ] \
                && [[ "$(version "stats/${name}")" > "$(version "../td-scorer/${name}")" ]]; then
                echo "stats/${name} is newer than this run's model: leaving it in place"
                continue
              fi
              if [ "${E2E}" = "true" ] && [ "${name}" = "td-scorer.json" ]; then
                continue
              fi
              cp "../td-scorer/${name}" "stats/${name}"
              git add "stats/${name}"
            done
            if [ "${E2E}" = "true" ]; then
              staged=$(git diff --cached --name-only)
              if [ -n "${staged}" ] && [ "${staged}" != "stats/td-scorer-budget.json" ]; then
                echo "::error::the end-to-end test staged ${staged}: not pushing"
                exit 1
              fi
            fi
            if git diff --cached --quiet; then
              echo "No changes to push"
              exit 0
            fi
            git commit -m "Updating the TD scorer models"
            if git push origin HEAD:generated-stats; then
              exit 0
            fi
          done
          echo "Failed to push to generated-stats after 5 attempts"
          exit 1

      - name: Fail when td-scorer-budget.json was refused
        if: steps.choose.outputs.refused != ''
        env:
          REFUSED: ${{ steps.choose.outputs.refused }}
        run: |
          echo "::error::${REFUSED}; td-scorer-budget.json did not get the budget model"
          exit 1
