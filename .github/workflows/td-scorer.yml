name: TD scorer refit

on:
  schedule:
    # Daily, after the day's test times and TD file ratings updates.
    - cron: "17 13 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/torchci/td/scorer/**"
      - ".github/workflows/td-scorer.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refit:
    runs-on: ubuntu-latest
    # The AWS credentials below last role-duration-seconds from their step; the job must
    # end before them (the backfill budget is store.BACKFILL_SECONDS).
    timeout-minutes: 285
    permissions:
      contents: read
      id-token: write
    outputs:
      ran: ${{ steps.refit.outputs.ran }}
    steps:
      - name: Checkout test-infra
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install -r tools/torchci/requirements.txt
          python -m pip install -e tools/torchci

      # The role trusts this repository's refs/heads/main OIDC subject; a job
      # environment would change the subject.
      - name: Configure AWS credentials
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@50ac8dd1e1b10d09dac7b8727528b91bed831ac0 # v3.0.2
        with:
          role-to-assume: arn:aws:iam::308535385114:role/upload_to_ossci_raw_job_status
          aws-region: us-east-1
          role-duration-seconds: 18000

      - name: Refit, gate and write the model
        id: refit
        working-directory: tools
        env:
          CLICKHOUSE_ENDPOINT: ${{ secrets.CLICKHOUSE_HUD_USER_URL }}
          CLICKHOUSE_USERNAME: ${{ secrets.CLICKHOUSE_HUD_USER_USERNAME }}
          CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_HUD_USER_PASSWORD }}
          ON_MAIN: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          # The test budget is opt-in: refit gets --budget only when this repository
          # variable is "on" (model_json.budget_on).
          TD_SCORER_BUDGET: ${{ vars.TD_SCORER_BUDGET }}
        run: |
          set -euo pipefail
          if [ -z "${CLICKHOUSE_ENDPOINT}" ]; then
            if [ "${ON_MAIN}" = "true" ]; then
              echo "::error::No ClickHouse credentials on main"
              exit 1
            fi
            echo "No ClickHouse credentials (a fork pull request): skipping the refit"
            echo "ran=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "ran=true" >> "${GITHUB_OUTPUT}"
          mkdir -p ../td-scorer
          outputs=(--out ../td-scorer/td-scorer.json
                   --report ../td-scorer/report.json
                   --sample ../td-scorer/sample.json)
          budget=off
          if python -c 'import os, sys
          from torchci.td.scorer.model_json import budget_on
          sys.exit(0 if budget_on(os.environ.get("TD_SCORER_BUDGET")) else 1)'; then
            budget=on
            outputs+=(--budget)
          fi
          echo "budget=${budget}" >> "${GITHUB_OUTPUT}"
          echo "TD scorer budget: ${budget}"
          if [ "${ON_MAIN}" = "true" ]; then
            python -m torchci.td.scorer refit --s3 "${outputs[@]}"
          else
            # Three days in memory: no S3, no publish, and the gate only reports.
            python -m torchci.td.scorer refit --train-days 2 --gate-days 1 \
              --report-only "${outputs[@]}"
          fi

      - name: Summarise the budget
        if: always() && steps.refit.outputs.ran == 'true'
        working-directory: tools
        env:
          BUDGET: ${{ steps.refit.outputs.budget }}
        run: |
          python - <<'PY' >> "${GITHUB_STEP_SUMMARY}"
          import json, os
          from pathlib import Path
          path = Path("../td-scorer/report.json")
          report = json.loads(path.read_text()) if path.exists() else {}
          budget = report.get("budget")
          print(f"TD scorer budget mode: {os.environ.get('BUDGET') or 'unknown'}")
          if budget:
              kept = "kept" if report.get("budget_kept") else "dropped"
              print(
                  f"- block {budget['block']} {kept}; realised mean share of test-times"
                  f" seconds {budget['seconds_share']:.3f}, of cost"
                  f" {budget['cost_share']:.3f}; per-PR retention"
                  f" {budget['retention']:.3f} ({budget['kept']} of {budget['prs']})"
              )
          else:
              print("- no budget block: the scorer's cut spends what TD's cut costs")
          PY

      - name: Upload the model
        if: always() && steps.refit.outputs.ran == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: td-scorer
          path: td-scorer/
          if-no-files-found: ignore

  # pytorch's validator and evaluator run in their own job, away from the AWS role and
  # the ClickHouse secrets.
  check:
    needs: refit
    if: needs.refit.outputs.ran == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      validated: ${{ steps.check.outputs.validated }}
    steps:
      - name: Checkout test-infra
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # scorer_model.py is standard library only; scorer.py's select_tests (the cut
      # replay) imports from tools/testing and tools/stats.
      - name: Checkout pytorch's TD scorer from pytorch main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: pytorch/pytorch
          ref: main
          path: pytorch
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            tools/testing
            tools/stats

      - name: Set up python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install -r tools/torchci/requirements.txt
          python -m pip install -e tools/torchci

      - name: Download the model
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: td-scorer
          path: td-scorer

      # check-pytorch exits 3 when pytorch main lacks the TD scorer code: nothing was
      # validated, so nothing publishes.
      - name: Validate with pytorch, compare p and r, replay the cut
        id: check
        working-directory: tools
        run: |
          set +e
          python -m torchci.td.scorer check-pytorch \
            --model ../td-scorer/td-scorer.json \
            --sample ../td-scorer/sample.json \
            --pytorch-root ../pytorch
          code=$?
          set -e
          if [ "${code}" -eq 0 ]; then
            echo "validated=true" >> "${GITHUB_OUTPUT}"
          elif [ "${code}" -eq 3 ]; then
            echo "validated=false" >> "${GITHUB_OUTPUT}"
          else
            exit "${code}"
          fi

  publish:
    needs: [refit, check]
    if: >-
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      && needs.check.outputs.validated == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download the model
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: td-scorer
          path: td-scorer

      # Fails closed: a model with a budget block publishes only while the repository
      # variable is "on", normalised as model_json.budget_on does (trim ASCII
      # whitespace, lowercase) without running repository code here.
      - name: Refuse a budget block unless TD_SCORER_BUDGET is on
        env:
          TD_SCORER_BUDGET: ${{ vars.TD_SCORER_BUDGET }}
          LC_ALL: C
        run: |
          set -euo pipefail
          value="${TD_SCORER_BUDGET}"
          value="${value#"${value%%[![:space:]]*}"}"
          value="${value%"${value##*[![:space:]]}"}"
          value="${value,,}"
          has_budget=$(python3 -c 'import json, sys; print("budget" in json.load(open(sys.argv[1])))' td-scorer/td-scorer.json)
          echo "TD scorer budget mode: $([ "${value}" = "on" ] && echo on || echo off); model has a budget block: ${has_budget}" | tee -a "${GITHUB_STEP_SUMMARY}"
          if [ "${has_budget}" != "False" ] && [ "${value}" != "on" ]; then
            echo "::error::td-scorer.json has a budget block but TD_SCORER_BUDGET is not on: not publishing"
            exit 1
          fi

      - name: Checkout generated-stats branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: generated-stats
          path: generated-stats
          fetch-depth: 1

      - name: Push stats/td-scorer.json to generated-stats
        working-directory: generated-stats
        run: |
          git config user.name "Pytorch Test Infra"
          git config user.email "test-infra@pytorch.org"
          # Other workflows push to generated-stats too: rebuild the commit on the latest tip
          # and retry when a push fails, e.g. because one of them pushed first.
          for attempt in 1 2 3 4 5; do
            if [ "${attempt}" -gt 1 ]; then
              sleep $((attempt * 15))
            fi
            if ! git fetch --depth=1 origin generated-stats; then
              continue
            fi
            git reset --hard FETCH_HEAD
            # enabled: false is the scorer's off switch; only a file that is absent or
            # enabled is replaced.
            if [ -f stats/td-scorer.json ]; then
              enabled=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1])).get("enabled") is True)' stats/td-scorer.json)
              if [ "${enabled}" != "True" ]; then
                echo "stats/td-scorer.json is not enabled: leaving it in place"
                exit 0
              fi
            fi
            cp ../td-scorer/td-scorer.json stats/td-scorer.json
            git add stats/td-scorer.json
            if git diff --cached --quiet; then
              echo "No changes to push"
              exit 0
            fi
            git commit -m "Updating the TD scorer model"
            if git push origin HEAD:generated-stats; then
              exit 0
            fi
          done
          echo "Failed to push to generated-stats after 5 attempts"
          exit 1
