name: Release binary to pypi

on:
  workflow_dispatch:
    inputs:
      dryrun:
        required: true
        type: choice
        default: enabled
        options:
          - enabled
          - disabled
      package:
        description: "Domain to prepare and release"
        required: true
        type: choice
        default: torchao
        options:
          - torchao
          - torchtune
          - executorch
          - torchvision
          - torchaudio
          - torchcodec

permissions:
  id-token: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: pytorchbot-env
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure aws credentials (pytorch account)
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708  # v5
        with:
          role-to-assume: arn:aws:iam::749337293305:role/gha_workflow_stage_wheels
          aws-region: us-east-1
      - name: Install AWS CLI v2
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp
          sudo /tmp/aws/install --update
          rm -rf /tmp/aws/ /tmp/awscliv2.zip
      - name: Verify AWS CLI installation
        run: aws --version
      - name: Copy staged binaries
        shell: bash
        env:
          PACKAGE: ${{ inputs.package || 'torchvision' }}
          DRY_RUN: ${{ inputs.dryrun || 'enabled' }}
        run: |
            set -exo pipefail

            # Init release versions variables
            source ./release/release_versions.sh
            # shellcheck disable=SC2086
            version="${PACKAGE^^}_VERSION"
            mkdir dist/
            # Only stdout is teed; --debug goes to stderr and stays in the job log.
            # shellcheck disable=SC2086
            aws s3 sync "s3://pytorch-backup/${PACKAGE}-${!version}-pypi-staging/" dist/ --debug \
              | tee -a "${RUNNER_TEMP}/download.log"
      - name: Display structure of downloaded files
        run: ls -R dist/

      # Runs before the publish step, so the title says what will be published
      # rather than asserting that it was.
      - name: Summarize files to publish
        if: always()
        shell: bash
        env:
          PACKAGE: ${{ inputs.package || 'torchvision' }}
          DRY_RUN: ${{ inputs.dryrun || 'enabled' }}
        run: |
            set -euo pipefail
            source ./release/release_versions.sh
            version="${PACKAGE^^}_VERSION"
            ./release/summarize_promoted_files.sh \
              "${RUNNER_TEMP}/download.log" \
              "${PACKAGE} ${!version} - files to publish to PyPI" \
              "${DRY_RUN}"

      - name: Publish package to PyPI
        if: ${{ inputs.dryrun == 'disabled' }}
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e  # release/v1.13
        with:
          verbose: true
