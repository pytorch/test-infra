name: Test setup nvidia

on:
  pull_request:
    paths:
      - .github/workflows/test-setup-nvidia.yml
      - .github/actions/setup-nvidia/action.yml
      - .github/workflows/linux_job_v2.yml
      - .github/scripts/test_setup_nvidia.py
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner-type:
          - linux.g5.4xlarge.nvidia.gpu
          - linux.g5.12xlarge.nvidia.gpu  # Choose a test case with multiple GPUs
    name: Install NVIDIA driver on ${{ matrix.runner-type }}
    runs-on: ${{ matrix.runner-type }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Test that setup-nvidia works
        uses: ./.github/actions/setup-nvidia

  test-custom-driver:
    uses: ./.github/workflows/linux_job_v2.yml
    with:
      runner: linux.g5.4xlarge.nvidia.gpu
      timeout: 30
      test-infra-repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      test-infra-ref: ${{ github.event.pull_request.head.sha || github.sha }}
      gpu-arch-type: cuda
      gpu-arch-version: '13.4'
      driver-version: '615.71.09'
      driver-download-url: https://download.nvidia.com/XFree86/Linux-x86_64/615.71.09/NVIDIA-Linux-x86_64-615.71.09.run
      use-custom-docker-registry: false
      script: |
        set -eux
        nvidia-smi
        test "$(nvidia-smi --query-gpu=driver_version --format=csv,noheader --id=0)" = '615.71.09'
        python -m venv .cu134-probe-venv
        probe_python="${PWD}/.cu134-probe-venv/bin/python"
        "${probe_python}" -m pip install 'torch==2.14.0.dev20260810+cu134' --extra-index-url https://download.pytorch.org/whl/nightly/cu134
        "${probe_python}" -m pip check
        "${probe_python}" -m pip freeze
        result=0
        for probe in \
          'import torch; print(torch.__version__, torch.version.cuda, flush=True)' \
          'import torch; x = torch.randn(4, device="cuda"); y = x + x; torch.cuda.synchronize(); print(y.cpu(), flush=True)' \
          'import torch; x = torch.randn(10, 10).cuda(); y = torch.randn(10, 10).cuda(); z = torch.mm(x, y); torch.cuda.synchronize(); torch.testing.assert_close(z.cpu(), x.cpu() @ y.cpu()); print("matmul passed", flush=True)'; do
          printf '\nPROBE: %s\n' "${probe}"
          if "${probe_python}" -X faulthandler -c "${probe}"; then
            printf 'Clean process exit\n'
          else
            result=1
            gdb --batch -ex run -ex 'thread apply all bt' --args "${probe_python}" -X faulthandler -c "${probe}"
          fi
        done
        exit "${result}"

  test-inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install PyYAML==6.0.3
      - run: python .github/scripts/test_setup_nvidia.py
