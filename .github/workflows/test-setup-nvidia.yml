name: Test setup nvidia

on:
  pull_request:
    paths:
      - .github/workflows/test-setup-nvidia.yml
      - .github/actions/setup-nvidia/action.yml
      - .github/workflows/linux_job_v2.yml
      - .github/scripts/test_setup_nvidia.py
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner-type:
          - linux.g5.4xlarge.nvidia.gpu
          - linux.g5.12xlarge.nvidia.gpu  # Choose a test case with multiple GPUs
    name: Install NVIDIA driver on ${{ matrix.runner-type }}
    runs-on: ${{ matrix.runner-type }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Test that setup-nvidia works
        uses: ./.github/actions/setup-nvidia

  test-custom-driver:
    uses: ./.github/workflows/linux_job_v2.yml
    with:
      runner: linux.g5.4xlarge.nvidia.gpu
      timeout: 30
      test-infra-repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      test-infra-ref: ${{ github.event.pull_request.head.sha || github.sha }}
      gpu-arch-type: cuda
      gpu-arch-version: '13.4'
      driver-version: '615.71.09'
      driver-download-url: https://download.nvidia.com/XFree86/Linux-x86_64/615.71.09/NVIDIA-Linux-x86_64-615.71.09.run
      use-custom-docker-registry: false
      script: |
        set -eux
        nvidia-smi
        test "$(nvidia-smi --query-gpu=driver_version --format=csv,noheader --id=0)" = '615.71.09'
        python -m venv .cu134-probe-venv
        probe_python="${PWD}/.cu134-probe-venv/bin/python"
        "${probe_python}" -m pip install 'torch==2.14.0.dev20260810+cu134' --extra-index-url https://download.pytorch.org/whl/nightly/cu134
        "${probe_python}" -m pip check
        "${probe_python}" -m pip freeze
        conda create -y --prefix "${PWD}/.cu134-cxx-runtime" -c conda-forge 'libstdcxx-ng>=13' 'libgcc-ng>=13'
        conda list --prefix "${PWD}/.cu134-cxx-runtime"
        result=0
        for runtime in baseline preloaded updated; do
          unset LD_PRELOAD
          case "${runtime}" in
            preloaded) export LD_PRELOAD="${PWD}/.cu134-cxx-runtime/lib/libstdc++.so.6:${PWD}/.cu134-cxx-runtime/lib/libgcc_s.so.1" ;;
            updated) conda install -y -n base -c conda-forge 'libstdcxx-ng>=13' 'libgcc-ng>=13' ;;
          esac
          printf '\nRUNTIME: %s\n' "${runtime}"
          if "${probe_python}" -X faulthandler .github/scripts/cuda134_probe.py; then
            printf 'Clean process exit\n'
          else
            result=1
            if ! timeout 120 gdb --batch -ex 'set breakpoint pending on' -ex 'catch throw' -ex run -ex bt -ex 'info sharedlibrary libstdc++' -ex 'set $exception = $rdi' -ex 'p ((char*(*)(void*)) (*(void***)$exception)[2])($exception)' -ex continue -ex bt --args "${probe_python}" -X faulthandler .github/scripts/cuda134_probe.py; then
              printf 'Debugger did not finish successfully; probe failure remains recorded\n'
            fi
          fi
        done
        exit "${result}"

  test-inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install PyYAML==6.0.3
      - run: python .github/scripts/test_setup_nvidia.py
