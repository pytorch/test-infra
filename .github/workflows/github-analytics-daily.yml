name: GitHub Analytics Daily

on:
  schedule:
    # Every day at 14:00 UTC
    - cron: 0 14 * * *
  pull_request:
    paths:
      - .github/workflows/github-analytics-daily.yml
      - tools/analytics/github_analyze.py
  workflow_call:
  workflow_dispatch:

jobs:
  # For each release in flight (github_analyze.py --in-flight picks them from the version.txt
  # of main and of the latest release branches, and the open milestones): lists the reverts
  # on main that are missing from its release branch, and scans its milestone, recording the
  # state of the release portal steps that check it (1.2, 2.9, 3.1) in misc.release_event.
  # A release branch that is not cut yet (release/2.16) only has its open items counted.
  # A release in flight needs release/portal/config/releases/<version>.yml.
  github-analyze:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout test-infra
      uses: actions/checkout@v4

    - name: Checkout PyTorch repository
      uses: actions/checkout@v4
      with:
        repository: pytorch/pytorch
        path: pytorch
        fetch-depth: 0  # Need full history and the release tags for analysis

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: python3 -m pip install PyYAML==6.0.3

    - name: Analyze the releases in flight
      env:
        GITHUB_TOKEN: ${{ github.token }}
        # A pull request only shows the status; it must not write to ClickHouse.
        WRITE_TO_CLICKHOUSE: ${{ github.event_name != 'pull_request' }}
        CLICKHOUSE_ENDPOINT: ${{ secrets.CLICKHOUSE_HUD_USER_URL }}
        CLICKHOUSE_USERNAME: ${{ secrets.CLICKHOUSE_HUD_USER_USERNAME }}
        CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_HUD_USER_PASSWORD }}
      run: |
        set -eu
        write=""
        if [ "${WRITE_TO_CLICKHOUSE}" = "true" ]; then
          write="--write-to-clickhouse"
        fi
        python3 tools/analytics/github_analyze.py \
          --repo-path ./pytorch \
          --remote origin \
          --in-flight \
          ${write}
