name: Sync Triton wheels from a triton-lang/triton run to download.pytorch.org test channel

# Copies the x86_64 / aarch64 triton wheels into s3://pytorch/whl/test/,
# either from a triton-lang/triton "Wheels" workflow run (source=github-run) or
# from the release published on PyPI (source=pypi). Every wheel must carry
# TRITON_VERSION from release/release_versions.sh. Wheels that already exist
# in the test channel are overwritten. Wheels are uploaded exactly as built or
# published: no renaming and no retagging, whatever the platform tag looks like,
# so the files and their sha256 match the source (PyPI's, for source=pypi).
#
# Dry run by default. Like the release promotion workflows, the upload job is
# gated behind the protected promote-env, so a reviewer has to approve it after
# reading the plan printed by the prepare job. The hourly update-s3-html
# workflow regenerates the whl/test index once the files are uploaded.

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Where to take the wheels from'
        required: true
        type: choice
        default: github-run
        options:
          - github-run
          - pypi
      run_id:
        description: 'Run ID of the triton-lang/triton Wheels workflow run, e.g. 39878672590 (source=github-run only)'
        required: false
        type: string
      source_repo:
        description: 'Repository that owns the run'
        required: false
        type: string
        default: triton-lang/triton
      dryrun:
        description: 'Enable dry run mode'
        required: true
        type: choice
        default: enabled
        options:
          - enabled
          - disabled

permissions:
  id-token: write
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository test-infra
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load version
        shell: bash
        run: |
          set -euo pipefail

          # TRITON_VERSION is the single source of truth for the release.
          source ./release/release_versions.sh
          if [[ ! "${TRITON_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: TRITON_VERSION must look like 3.9.0, got '${TRITON_VERSION}'"
            exit 1
          fi
          echo "TRITON_VERSION=${TRITON_VERSION}" >> "${GITHUB_ENV}"

      - name: Validate triton-lang/triton run
        if: ${{ inputs.source == 'github-run' }}
        shell: bash
        env:
          RUN_ID: ${{ inputs.run_id }}
          SOURCE_REPO: ${{ inputs.source_repo }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ ! "${RUN_ID}" =~ ^[0-9]+$ ]]; then
            echo "ERROR: run_id must be numeric for source=github-run, got '${RUN_ID}'"
            exit 1
          fi
          if [[ "${SOURCE_REPO}" != "triton-lang/triton" ]]; then
            echo "ERROR: only triton-lang/triton runs can be synced, got '${SOURCE_REPO}'"
            exit 1
          fi

          # The run itself may be marked failed (its Azure DevOps publish step
          # needs credentials we do not have); only the artifacts matter.
          run_json=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${SOURCE_REPO}/actions/runs/${RUN_ID}")
          echo "${run_json}" | jq '{name, path, event, status, conclusion, head_branch, head_sha}'

          path=$(echo "${run_json}" | jq -r '.path')
          branch=$(echo "${run_json}" | jq -r '.head_branch')
          if [[ "${path}" != ".github/workflows/wheels.yml" ]]; then
            echo "ERROR: run is from '${path}', expected .github/workflows/wheels.yml"
            exit 1
          fi
          if [[ "${branch}" != release/* ]]; then
            echo "ERROR: run is from branch '${branch}', expected release/*"
            exit 1
          fi

      - name: Download wheel artifacts
        if: ${{ inputs.source == 'github-run' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          repository: ${{ inputs.source_repo }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          pattern: cibw-wheels-manylinux_2_28_*-wheels-upload
          merge-multiple: true
          path: wheelhouse

      - name: Download wheels from PyPI
        if: ${{ inputs.source == 'pypi' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wheelhouse

          if ! json=$(curl -fsSL "https://pypi.org/pypi/triton/${TRITON_VERSION}/json"); then
            echo "ERROR: triton ${TRITON_VERSION} is not published on PyPI"
            exit 1
          fi

          # Every x86_64 and aarch64 wheel of the release, whatever its tag form
          # (manylinux_2_27.manylinux_2_28, manylinux_2_28, linux, ...). The file
          # name is not used to pick or change anything beyond the architecture;
          # yanked files are skipped.
          echo "${json}" | jq -r '
            .urls[]
            | select(.packagetype == "bdist_wheel" and (.yanked | not))
            | select(.filename | test("(x86_64|aarch64)\\.whl$"))
            | [.filename, .url, .digests.sha256] | @tsv' > pypi_wheels.tsv

          if [[ ! -s pypi_wheels.tsv ]]; then
            echo "ERROR: no x86_64 / aarch64 wheels for triton ${TRITON_VERSION} on PyPI"
            exit 1
          fi

          while IFS=$'\t' read -r name url sha256; do
            echo "Downloading ${name}"
            curl -fsSL -o "wheelhouse/${name}" "${url}"
            echo "${sha256}  wheelhouse/${name}" | sha256sum -c -
          done < pypi_wheels.tsv

      - name: Prepare wheels
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${TRITON_VERSION}"

          cd wheelhouse
          ls -la

          shopt -s nullglob
          wheels=(*.whl)
          if [[ ${#wheels[@]} -eq 0 ]]; then
            echo "ERROR: no wheels found in the downloaded artifacts"
            exit 1
          fi

          for whl in "${wheels[@]}"; do
            if [[ "${whl}" != "triton-${VERSION}-"* ]]; then
              echo "ERROR: ${whl} is not triton ${VERSION}"
              exit 1
            fi
            # Only the architecture is checked; the file is uploaded unchanged.
            case "${whl}" in
              *x86_64.whl | *aarch64.whl)
                ;;
              *)
                echo "ERROR: ${whl} is not an x86_64 or aarch64 wheel"
                exit 1
                ;;
            esac
          done

          echo "Wheels to upload:"
          sha256sum -- *.whl

      - name: Print upload plan
        shell: bash
        env:
          SOURCE: ${{ inputs.source }}
          SOURCE_REPO: ${{ inputs.source_repo }}
          RUN_ID: ${{ inputs.run_id }}
          DRY_RUN: ${{ inputs.dryrun }}
        run: |
          set -euo pipefail
          {
            echo "### Triton wheels to upload to \`s3://pytorch/whl/test/\`"
            echo
            if [[ "${SOURCE}" == "pypi" ]]; then
              echo "Source: https://pypi.org/project/triton/${TRITON_VERSION}/"
            else
              echo "Source: https://github.com/${SOURCE_REPO}/actions/runs/${RUN_ID}"
            fi
            echo "Version: ${TRITON_VERSION} (from release/release_versions.sh)"
            echo
            echo "| File | sha256 |"
            echo "|---|---|"
            (cd wheelhouse && for whl in *.whl; do
              echo "| \`${whl}\` | \`$(sha256sum "${whl}" | awk '{print $1}')\` |"
            done)
            echo
            echo "Existing files with the same name are overwritten."
            echo
            if [[ "${DRY_RUN}" == "disabled" ]]; then
              echo "> **Not a dry run.** Approving the \`upload\` job copies these wheels to \`whl/test\`."
            else
              echo "> Dry run: approving only prints what would be copied."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Stage prepared wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: triton-wheels-to-sync
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 7

  upload:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: promote-env
    steps:
      - name: Fetch prepared wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: triton-wheels-to-sync
          path: wheelhouse

      - name: Configure aws credentials (pytorch account)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::749337293305:role/gha_workflow_promote_wheels
          aws-region: us-east-1

      - name: Upload wheels to whl/test
        shell: bash
        env:
          DRYRUN: ${{ inputs.dryrun }}
        run: |
          set -euo pipefail
          pip install awscli==1.32.18

          AWS_CMD="aws s3 cp --dryrun"
          if [[ "${DRYRUN}" == "disabled" ]]; then
            AWS_CMD="aws s3 cp"
          fi

          cd wheelhouse
          for whl in *.whl; do
            shm_id=$(sha256sum "${whl}" | awk '{print $1}')
            # Existing objects with the same name are overwritten.
            ${AWS_CMD} "${whl}" "s3://pytorch/whl/test/" --acl public-read \
              --metadata "checksum-sha256=${shm_id}"
          done
