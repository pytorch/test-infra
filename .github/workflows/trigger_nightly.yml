name: Trigger nightly builds for domains

on:
  schedule:
    # every night at 11:30AM UTC, 7:30AM EST, 4:30AM PST
    - cron: 30 11 * * *
  workflow_dispatch:
    inputs:
      domain:
        description: "What domain to trigger"
        required: false
        type: choice
        default: all
        options:
          - vision
          - audio
          - torchrec
          - tensorrt
          - data
          - fbgemm
          - mslk
          - executorch
          - torchtune
          - torchcodec
          - torchvision-extra-decoders
          - torchtitan
          - torchcomms
          - torchforge
          - all
jobs:
  trigger:
    name: Trigger nightly ${{ matrix.domain }} build
    runs-on: ubuntu-latest
    environment: trigger-nightly
    timeout-minutes: 60
    strategy:
      # One broken domain shouldn't stop the other ones from being triggered
      fail-fast: false
      matrix:
        include:
          - domain: audio
            repository: pytorch/audio
            ref: main
          - domain: data
            repository: pytorch/data
            ref: main
          - domain: vision
            repository: pytorch/vision
            ref: main
          - domain: torchrec
            repository: pytorch/torchrec
            ref: main
          - domain: tensorrt
            repository: pytorch/tensorrt
            ref: main
          - domain: fbgemm
            repository: pytorch/fbgemm
            ref: main
          - domain: mslk
            repository: meta-pytorch/mslk
            ref: main
          - domain: executorch
            repository: pytorch/executorch
            ref: viable/strict
          - domain: torchtune
            repository: pytorch/torchtune
            ref: main
          - domain: torchcodec
            repository: meta-pytorch/torchcodec
            ref: main
          - domain: torchvision-extra-decoders
            repository: meta-pytorch/torchvision-extra-decoders
            ref: main
          - domain: torchtitan
            repository: pytorch/torchtitan
            ref: main
          - domain: torchcomms
            repository: meta-pytorch/torchcomms
            ref: main
          - domain: torchforge
            repository: meta-pytorch/torchforge
            ref: main
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Trigger nightly ${{ matrix.domain }} build
        if: ${{ github.event_name == 'schedule' || inputs.domain == matrix.domain || inputs.domain == 'all' }}
        uses: ./.github/actions/trigger-nightly
        with:
          ref: ${{ matrix.ref }}
          repository: ${{ matrix.repository }}
          token: ${{ secrets.GH_PYTORCHBOT_TOKEN }}
          path: ${{ matrix.domain }}
