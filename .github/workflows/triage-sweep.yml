name: Recover triaged PR promotions

on:
  schedule:
    # Recover missed triaged-label webhooks in bounded rotating batches.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

# Avoid overlapping scheduled/manual recovery runs.
concurrency:
  group: triage-sweep
  cancel-in-progress: false

jobs:
  triage-sweep:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Promote eligible triaged PRs using PyTorchBot
        env:
          DRCI_BOT_KEY: ${{ secrets.DRCI_BOT_KEY }}
          HUD_API_TOKEN: ${{ secrets.HUD_API_TOKEN }}
        run: |
          curl --request POST \
            --url 'https://hud.pytorch.org/api/triage/sweep' \
            --header "Authorization: ${DRCI_BOT_KEY}" \
            --header "x-hud-internal-bot: ${HUD_API_TOKEN}" \
            --max-time 910 \
            --silent --show-error --fail-with-body
