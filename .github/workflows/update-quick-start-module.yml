name: Update quick start module

# Moved here from pytorch/pytorch.github.io (.github/workflows/update-quick-start-module.yml).
# The generator scripts, their templates and inputs, and the generated files
# (published_versions.json, releases.json, additional-platforms.json and the
# assets/*.js modules) live in tools/quick_start; see tools/quick_start/README.md.

on:
  schedule:
    # At 18:30 pm UTC (1:30 pm EST)
    - cron: "30 18 * * *"
  pull_request:
    paths:
      - .github/workflows/update-quick-start-module.yml
      - tools/quick_start/scripts/gen_quick_start_module.py
      - tools/quick_start/scripts/gen_additional_platforms.py
      - tools/quick_start/_includes/*.js
      - tools/quick_start/_additional_platforms/*.json
      - tools/quick_start/_get_started/additional_platforms/*.md
      - tools/scripts/generate_binary_build_matrix.py
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-quick-start-module.yml
      - tools/quick_start/scripts/gen_quick_start_module.py
      - tools/quick_start/scripts/gen_additional_platforms.py
      - tools/quick_start/_includes/*.js
      - tools/quick_start/_additional_platforms/*.json
      - tools/quick_start/_get_started/additional_platforms/*.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-nightly-matrix:
    uses: ./.github/workflows/generate_binary_build_matrix.yml
    with:
      package-type: all
      os: linux
      channel: "nightly"
      getting-started: true
  windows-nightly-matrix:
    uses: ./.github/workflows/generate_binary_build_matrix.yml
    with:
      package-type: all
      os: windows
      channel: "nightly"
      getting-started: true
  macos-arm64-nightly-matrix:
    uses: ./.github/workflows/generate_binary_build_matrix.yml
    with:
      package-type: all
      os: macos-arm64
      channel: "nightly"
      getting-started: true
  linux-release-matrix:
    needs: [linux-nightly-matrix]
    uses: ./.github/workflows/generate_binary_build_matrix.yml
    with:
      package-type: all
      os: linux
      channel: "release"
      getting-started: true
  windows-release-matrix:
    needs: [windows-nightly-matrix]
    uses: ./.github/workflows/generate_binary_build_matrix.yml
    with:
      package-type: all
      os: windows
      channel: "release"
      getting-started: true
  macos-arm64-release-matrix:
    needs: [macos-arm64-nightly-matrix]
    uses: ./.github/workflows/generate_binary_build_matrix.yml
    with:
      package-type: all
      os: macos-arm64
      channel: "release"
      getting-started: true

  update-quick-start:
    needs: [linux-nightly-matrix, windows-nightly-matrix, macos-arm64-nightly-matrix,
    linux-release-matrix, windows-release-matrix, macos-arm64-release-matrix]
    runs-on: "ubuntu-latest"
    # Holds GH_PYTORCHBOT_TOKEN, which opens the PR. Pull requests only
    # regenerate the files to check that the generator still runs.
    environment: ${{ github.event_name != 'pull_request' && 'trigger-nightly' || '' }}
    steps:
      - name: Checkout test-infra
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          architecture: x64
      - name: Create json file
        shell: bash
        working-directory: tools/quick_start
        env:
          LINUX_NIGHTLY_MATRIX: ${{ needs.linux-nightly-matrix.outputs.matrix }}
          WINDOWS_NIGHTLY_MATRIX: ${{ needs.windows-nightly-matrix.outputs.matrix }}
          MACOS_NIGHTLY_MATRIX: ${{ needs.macos-arm64-nightly-matrix.outputs.matrix }}
          LINUX_RELEASE_MATRIX: ${{ needs.linux-release-matrix.outputs.matrix }}
          WINDOWS_RELEASE_MATRIX: ${{ needs.windows-release-matrix.outputs.matrix }}
          MACOS_RELEASE_MATRIX: ${{ needs.macos-arm64-release-matrix.outputs.matrix }}
        run: |
          set -ex
          printf '%s\n' "$LINUX_NIGHTLY_MATRIX" > linux_nightly_matrix.json
          printf '%s\n' "$WINDOWS_NIGHTLY_MATRIX" > windows_nightly_matrix.json
          printf '%s\n' "$MACOS_NIGHTLY_MATRIX" > macos_nightly_matrix.json
          printf '%s\n' "$LINUX_RELEASE_MATRIX" > linux_release_matrix.json
          printf '%s\n' "$WINDOWS_RELEASE_MATRIX" > windows_release_matrix.json
          printf '%s\n' "$MACOS_RELEASE_MATRIX" > macos_release_matrix.json
          python3 ./scripts/gen_quick_start_module.py --autogenerate > assets/quick-start-module.js
          rm -- ./*_matrix.json
      - name: Create Pull Request
        if: ${{ github.event_name != 'pull_request' }}
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.GH_PYTORCHBOT_TOKEN }}
          branch: create-pull-request/update-quick-start
          commit-message: Modify published_versions.json, releases.json and quick-start-module.js
          title: '[Getting Started Page] Modify published_versions.json, releases.json and quick-start-module.js'
          body: >
            This PR is auto-generated. It updates the Getting Started page quick-start module
            in tools/quick_start.
          labels: automated pr
          add-paths: |
            tools/quick_start/published_versions.json
            tools/quick_start/releases.json
            tools/quick_start/assets/quick-start-module.js

  update-additional-platform:
    runs-on: "ubuntu-latest"
    environment: ${{ github.event_name != 'pull_request' && 'trigger-nightly' || '' }}
    steps:
      - name: Checkout test-infra
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install markdown==3.11.2 pygments==2.21.0
      - name: Generate additional-platforms assets
        shell: bash
        working-directory: tools/quick_start
        run: |
          set -ex
          python3 ./scripts/gen_additional_platforms.py
      - name: Create Pull Request
        if: ${{ github.event_name != 'pull_request' }}
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.GH_PYTORCHBOT_TOKEN }}
          branch: create-pull-request/update-additional-platforms
          commit-message: Regenerate additional-platforms assets
          title: '[Additional Platforms] Regenerate quick-start-additional-platforms.js and additional-platforms.json'
          body: >
            This PR is auto-generated. It regenerates the third-party vendor
            accelerator picker assets after a change to
            tools/quick_start/_additional_platforms/*.json or
            tools/quick_start/_get_started/additional_platforms/*.md.
          labels: automated pr
          add-paths: |
            tools/quick_start/assets/quick-start-additional-platforms.js
            tools/quick_start/additional-platforms.json
