name: Sync the OSDC HF caches

# A ci-refresh-hf-cache run writes only the bucket of the cluster its runner
# landed in, and a job can land in any of them, so the regional caches drift
# and a job routed to a cold region fails with a read-only file system error.
# This brings the clusters below to the union of their contents. It never
# deletes, and a run with nothing to copy is only the bucket listings.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/hf-cache-sync.yml
      - tools/scripts/hf_cache_sync.py

concurrency:
  # Never cancel a run mid-copy; a scheduled run that finds one in progress
  # waits, and the copy it would have made is still there to make.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  sync:
    if: ${{ github.repository == 'pytorch/test-infra' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout pytorch/test-infra
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: tools/scripts

      - name: Install dependencies
        run: pip3 install boto3==1.35.42

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@50ac8dd1e1b10d09dac7b8727528b91bed831ac0 # v3.0.2
        with:
          role-to-assume: arn:aws:iam::308535385114:role/gha_workflow_hf-cache-write
          aws-region: us-east-1
          # A cold region can need hundreds of GB copied in one run.
          role-duration-seconds: 18000

      - name: Sync the caches
        env:
          # A pull request only reports what a scheduled run would copy.
          APPLY: ${{ github.event_name != 'pull_request' && '--apply' || '' }}
        run: |
          # meta-prod-aws-uw1 is left out: the region is being retired, and
          # syncing it would copy its ~1 TB of full-weight models everywhere.
          python3 tools/scripts/hf_cache_sync.py --sync \
            --to meta-prod-aws-ue1 \
            --to meta-prod-aws-ue2 \
            --to meta-prod-aws-uw2 \
            ${APPLY}
