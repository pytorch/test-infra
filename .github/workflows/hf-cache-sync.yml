name: Sync the OSDC HF caches

# A ci-refresh-hf-cache run only writes its own region's bucket, so copy what
# each prod cluster is missing from the others.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/hf-cache-sync.yml
      - tools/scripts/hf_cache_sync.py

concurrency:
  # Never cancel a run mid-copy.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  sync:
    if: ${{ github.repository == 'pytorch/test-infra' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout pytorch/test-infra
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: tools/scripts

      - name: Install dependencies
        run: pip3 install boto3==1.35.42

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@50ac8dd1e1b10d09dac7b8727528b91bed831ac0 # v3.0.2
        with:
          role-to-assume: arn:aws:iam::308535385114:role/gha_workflow_hf-cache-write
          aws-region: us-east-1
          role-duration-seconds: 18000

      - name: Sync the caches
        run: python3 tools/scripts/hf_cache_sync.py --sync --apply
