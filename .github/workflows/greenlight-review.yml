name: Green Light Scan

# The periodic scan runs as the `greenlight-scan` AWS Lambda (pytorch-gha-infra-2, us-east-1,
# EventBridge rate(2 minutes)): its planner scans pytorch/pytorch itself and fans out one worker
# invocation per other repo with a `.github/greenlight/config.yml` (greenlight/SCAN.md). This
# workflow is the manual / `@greenlight recheck` path for one repo: dispatched by filename from a
# pytorch/pytorch trigger (or run by hand), it runs the same greenlight scanner on `repo`. With `pr`
# it rechecks that PR of `repo` (`greenlight review --repo REPO --pr N`); without it, it scans `repo`
# once (`greenlight review --repo REPO`), listing its open PRs from its evaluation cohort and
# dispatching greenlight-pr-review.yml for each new or changed PR whose author is eligible, on a base
# trymerge's base rule accepts, matched by branch name (greenlight/TRUSTED_AUTHORS.md); no other
# listed PR is dispatched. It takes no lease and keeps no state between runs.
# Read-only on ClickHouse; dispatches the reviewer workflow via the App's test-infra token.

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Repo to scan (pytorch/<name>); it must have a GreenLight config, as greenlight/REPOS.md defines (pytorch/pytorch has a built-in one)"
        required: false
        default: "pytorch/pytorch"
        type: string
      pr:
        description: "Single PR number of `repo` to scan; its author must be eligible and trymerge must accept its base, as greenlight/TRUSTED_AUTHORS.md defines (empty = whole evaluation cohort)"
        required: false
        default: ""
        type: string
      requester:
        description: "Login that requested this review (@greenlight recheck); must be in the evaluation cohort (every merge_rules.yaml approver, minus bots and greenlight itself)"
        required: false
        default: ""
        type: string
      max:
        # Matches _DEFAULT_MAX_DISPATCHES_PER_SCAN in greenlight/src/greenlight/lambda_handler.py,
        # which the scheduled Lambda overrides through PYTORCH_GREENLIGHT_MAX_DISPATCHES_PER_SCAN:
        # this default tracks the Lambda's default, not whatever cap the Lambda is running today. A
        # dispatch costs 3-8s of serial main-thread work, so an uncapped pass over the whole
        # evaluation cohort fires an unbounded burst of workflow_dispatch POSTs on one token --
        # what GitHub's secondary rate limit punishes hardest, and why the scan already throttles
        # its fingerprint fan-out. Deferring is free: no state row is written for a PR that is
        # never reached, so the next run re-evaluates it.
        description: "Max dispatches this run; matches the Lambda's default (clear the field for no cap)"
        required: false
        default: "30"
        type: string
      ref:
        description: "Ref of greenlight-pr-review.yml to dispatch"
        required: false
        default: "main"
        type: string
      timeout_minutes:
        description: "In-flight / re-dispatch timeout (minutes)"
        required: false
        default: "45"
        type: string
      log_level:
        description: "Log verbosity"
        required: false
        default: "INFO"
        type: choice
        options:
          - DEBUG
          - INFO
          - WARNING
          - ERROR

# Singleton: only one scan runs at a time, and a new dispatch waits rather than
# cancelling an in-flight scan (which could leave dispatch bookkeeping half-done).
concurrency:
  group: ${{ github.workflow }}-singleton
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: greenlight

jobs:
  scan:
    runs-on: ubuntu-latest
    # Protected environment holding the Green Light App key: GREENLIGHT_APP_ID and
    # GREENLIGHT_APP_PRIVATE_KEY. The App must be installed on pytorch/test-infra with Actions:
    # write, so the dispatch token can dispatch the reviewer workflow, and on every configured repo
    # with Pull requests: write, so the repo token can read its PRs, revoke greenlight's own
    # approval on a reverted or no-longer-eligible PR, and set greenlight's GL/* labels.
    environment: greenlight-record
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea  # v4.2.1
        with:
          working_directory: greenlight

      - name: Sync dependencies
        run: just setup

      # The repo token covers `repo` alone, named inside the pytorch account as the mint takes it. The
      # input is checked against a strict pattern first, since it reaches the mint and the CLI.
      - name: Name the repo
        id: repo
        env:
          IN_REPO: ${{ inputs.repo }}
        run: |
          set -euo pipefail
          name=""
          if [[ "$IN_REPO" =~ ^pytorch/([A-Za-z0-9_.-]{1,100})$ ]]; then name="${BASH_REMATCH[1]}"; fi
          if [ -z "$name" ] || [[ "$name" =~ ^\.+$ ]]; then
            echo "::error::repo must be pytorch/<name>"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # The two permission sets are app_tokens.DISPATCH_TOKEN_PERMISSIONS and REPO_TOKEN_PERMISSIONS,
      # the ones the Lambda mints; tests/test_review_workflow_tokens.py pins them.
      - name: Mint the dispatch token
        id: dispatch-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349  # v2.2.2
        with:
          app-id: ${{ secrets.GREENLIGHT_APP_ID }}
          private-key: ${{ secrets.GREENLIGHT_APP_PRIVATE_KEY }}
          owner: pytorch
          repositories: test-infra
          permission-actions: write
          permission-contents: read

      - name: Mint the repo token
        id: repo-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349  # v2.2.2
        with:
          app-id: ${{ secrets.GREENLIGHT_APP_ID }}
          private-key: ${{ secrets.GREENLIGHT_APP_PRIVATE_KEY }}
          owner: pytorch
          repositories: ${{ steps.repo.outputs.name }}
          permission-pull-requests: write
          permission-contents: read
          permission-members: read

      # The scan PUTs an AI_REVIEW_DISPATCHED state row to S3 via boto3 the instant it fires the
      # reviewer workflow, so it needs the same OIDC role/arc the reviewer and record jobs use.
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4.3.1
        with:
          role-to-assume: arn:aws:iam::308535385114:role/arc
          aws-region: us-east-1

      - name: Scan and dispatch
        env:
          PYTORCH_GREENLIGHT_GITHUB_TOKEN: ${{ steps.repo-token.outputs.token }}
          PYTORCH_GREENLIGHT_DISPATCH_TOKEN: ${{ steps.dispatch-token.outputs.token }}
          # The App's bot login (<slug>[bot]) author-scopes the recheck-refusal comment and picks
          # out greenlight's own approvals to revoke on a reverted or no-longer-eligible PR. An empty
          # app-slug yields the bare "[bot]", which the CLI rejects as not App-shaped rather than
          # silently matching nothing.
          BOT_LOGIN: ${{ steps.repo-token.outputs.app-slug }}[bot]
          CLICKHOUSE_ENDPOINT: ${{ secrets.CLICKHOUSE_HUD_USER_URL }}
          CLICKHOUSE_USERNAME: ${{ secrets.CLICKHOUSE_HUD_USER_USERNAME }}
          CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_HUD_USER_PASSWORD }}
          PYTORCH_GREENLIGHT_DRCI_TOKEN: ${{ secrets.DRCI_BOT_KEY }}
          PYTORCH_GREENLIGHT_DRCI_INTERNAL_TOKEN: ${{ secrets.HUD_API_TOKEN }}
          IN_REPO: ${{ inputs.repo }}
          IN_PR: ${{ inputs.pr }}
          IN_REQUESTER: ${{ inputs.requester }}
          IN_MAX: ${{ inputs.max }}
          IN_REF: ${{ inputs.ref }}
          IN_TIMEOUT: ${{ inputs.timeout_minutes }}
          IN_LOG_LEVEL: ${{ inputs.log_level }}
        run: |
          set -euo pipefail
          args=(--repo "$IN_REPO")
          if [ -n "$IN_PR" ]; then args+=(--pr "$IN_PR"); fi
          if [ -n "$IN_REQUESTER" ]; then args+=(--requester "$IN_REQUESTER"); fi
          if [ -n "$IN_MAX" ]; then args+=(--max "$IN_MAX"); fi
          args+=(--ref "$IN_REF" --timeout-minutes "$IN_TIMEOUT" --log-level "$IN_LOG_LEVEL")
          mise exec -- uv run greenlight review "${args[@]}"
