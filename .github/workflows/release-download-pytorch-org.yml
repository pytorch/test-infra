name: Release torch, triton or an ecosystem library from test to production.
run-name: Release ${{ inputs.package || 'torchvision' }} to production (dryrun=${{ inputs.dryrun || 'enabled' }})

on:
  workflow_dispatch:
    inputs:
      dryrun:
        required: true
        type: choice
        default: enabled
        options:
          - enabled
          - disabled
      package:
        description: "Package to prepare and release. torch, libtorch, torchvision and torchaudio skip the targets in RELEASE_PROMOTE_SKIP_TARGETS (release/release_versions.sh); triton releases triton, triton_rocm and triton_xpu together"
        required: true
        type: choice
        default: torchvision
        options:
          - torch
          - libtorch
          - triton
          - torchao
          - torchtune
          - executorch
          - torchvision
          - torchaudio
          - torchcodec
          - torchcomms
          - torch_tensorrt
          - torch_tensorrt_rtx
          - torch_tensorrt_executorch_runtime
          - torchrec
          - fbgemm_gpu
          - fbgemm_gpu_genai
          - mslk
          - flash_attn_3

permissions:
  id-token: write
  contents: read

jobs:
  # Runs before the approval gate on `trigger`: the environment approval screen does
  # not show workflow inputs, but this job's summary is on the run page while the
  # deployment waits for a reviewer.
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Show what approval will release
        shell: bash
        env:
          PACKAGE: ${{ inputs.package || 'torchvision' }}
          DRY_RUN: ${{ inputs.dryrun || 'enabled' }}
        run: |
            set -euo pipefail
            source ./release/release_versions.sh
            release_package_vars "${PACKAGE}"
            {
              echo "## Release ${PACKAGE} ${!version:-unknown}"
              echo
              echo "| Input | Value |"
              echo "|---|---|"
              echo "| package | \`${PACKAGE}\` |"
              if [[ "${packages}" != "${PACKAGE}" ]]; then
                echo "| promotes | \`${packages// /\`, \`}\` |"
              fi
              echo "| version | \`${!version:-unknown}\` |"
              echo "| skipped targets | \`${skip_targets:-none}\` |"
              echo "| dryrun | \`${DRY_RUN}\` |"
              echo "| ref | \`${GITHUB_REF_NAME}\` (\`${GITHUB_SHA::7}\`) |"
              echo "| requested by | ${GITHUB_ACTOR} |"
              echo
              if [[ "${DRY_RUN}" == "disabled" ]]; then
                echo "> **Not a dry run.** Approving copies the wheels from \`whl/test\` to \`whl/\` on S3 and to R2."
              else
                echo "> Dry run: approving only prints what would be copied."
              fi
              echo
              # Every binary the approval would promote, so the reviewer reads the
              # list before approving instead of after.
              read -ra pkgs <<<"${packages}"
              for pkg in "${pkgs[@]}"; do
                python3 release/preview_promotion.py "${pkg}" "${!version}" "${skip_targets}"
                echo
              done
            } >> "${GITHUB_STEP_SUMMARY}"

  trigger:
    needs: preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: promote-env
    container:
      image: pytorch/almalinux-builder:cpu
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure aws credentials (pytorch account)
        uses: aws-actions/configure-aws-credentials@50ac8dd1e1b10d09dac7b8727528b91bed831ac0 # v3.0.2
        with:
          role-to-assume: arn:aws:iam::749337293305:role/gha_workflow_promote_wheels
          aws-region: us-east-1
      - name: Promote library to download.pytorch.org
        shell: bash
        env:
          PACKAGE: ${{ inputs.package || 'torchvision' }}
          DRY_RUN: ${{ inputs.dryrun || 'enabled' }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
            set -exo pipefail
            cd release
            # Install requirements
            pip install awscli==1.32.18
            pip install -r ../s3_management/requirements.txt

            promote_s3() {
              local package_name
              package_name=$1
              local package_type
              package_type=$2
              local promote_version
              promote_version=$3

              # shellcheck disable=SC2086
              echo "=-=-=-= Promoting ${package_name}'s v${promote_version} ${package_type} packages' =-=-=-="
              (
                  set -x
                  # shellcheck disable=SC2086
                  TEST_PYTORCH_PROMOTE_VERSION="${promote_version}" \
                      PACKAGE_NAME="${package_name}" \
                      PACKAGE_TYPE="${package_type}" \
                      TEST_WITHOUT_GIT_TAG=1 \
                      DRY_RUN="${DRY_RUN}" ./promote/s3_to_s3.sh
              )
              echo
            }

            # Init release versions variables
            source ./release_versions.sh
            # Run promotion
            release_package_vars "${PACKAGE}"

            # Read by release/promote/common_utils.sh for both the S3 and R2 copies.
            export PACKAGE_EXCLUDE_TARGETS="${skip_targets}"

            # do not upload FA3 test wheels with local date suffix
            if [[ "${PACKAGE}" == "flash_attn_3" ]]; then
              export PACKAGE_INCLUDE_SUFFIX="-*"
            fi

            # Tee the transfer output so the next step can list what moved.
            # A failure in one package stops the run, before the next one is copied.
            read -ra pkgs <<<"${packages}"
            for pkg in "${pkgs[@]}"; do
              promote_s3 "${pkg}" "${package_type}" "${!version}" 2>&1 | tee -a "${RUNNER_TEMP}/promote.log"
            done

      # always(): a promotion that dies partway through is exactly when you want to
      # know which files already made it to prod.
      - name: Summarize promoted files
        if: always()
        shell: bash
        env:
          PACKAGE: ${{ inputs.package || 'torchvision' }}
          DRY_RUN: ${{ inputs.dryrun || 'enabled' }}
        run: |
            set -euo pipefail
            source ./release/release_versions.sh
            release_package_vars "${PACKAGE}"
            ./release/summarize_promoted_files.sh \
              "${RUNNER_TEMP}/promote.log" \
              "${packages// /, } ${!version} - promoted to download.pytorch.org${skip_targets:+ (skipped: ${skip_targets})}" \
              "${DRY_RUN}"

      - name: Recompute SHA256 on whl/ (prod) for promoted package
        if: ${{ inputs.dryrun == 'disabled' }}
        shell: bash
        env:
          PACKAGE: ${{ inputs.package || 'torchvision' }}
        run: |
            set -ex
            # Init release versions variables
            source ./release/release_versions.sh
            release_package_vars "${PACKAGE}"
            # Backfill SHA256 metadata for wheels missing it (skips existing).
            # Bare --recompute-sha256-pattern scans all prod accelerator
            # subfolders (cu*/rocm*/cpu/xpu) for this package/version.
            # manage_v2.py only knows the whl channel; libtorch archives carry no
            # checksum metadata.
            if [[ "${package_type}" != "whl" ]]; then
              echo "Nothing to recompute for ${package_type} packages."
              exit 0
            fi
            read -ra pkgs <<<"${packages}"
            for pkg in "${pkgs[@]}"; do
              python s3_management/manage_v2.py whl \
                --recompute-sha256-pattern \
                --package-name "${pkg}" \
                --package-version "${!version}"
            done
