name: Refresh release runner groups

# build_wheels_linux.yml declares the job that lands on a release runner, and
# GitHub matches a runner group's allow-list against the workflow that declares
# the job rather than the caller -- pytorch/pytorch's own entries list
# _binary-build-linux.yml alongside its generated callers for the same reason.
# The callers here live in other repositories, so their own refresh runs cannot
# see this file; it is allow-listed from here instead.

on:
  push:
    # No paths filter: the entries follow this repository's branches, so cutting
    # release/X.Y is exactly when the set changes, and a branch creation carries
    # no diff for a paths filter to match.
    branches:
      - main
      - release/*
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply changes (otherwise dry-run)"
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/release-runner-groups-refresh.yml
      - tools/scripts/release_manage_runner_groups.py
      - tools/tests/test_release_manage_runner_groups.py

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name == 'workflow_dispatch' }}
  cancel-in-progress: true

jobs:
  reconcile:
    if: github.repository_owner == 'pytorch'
    runs-on: ubuntu-latest
    environment: ${{ github.event_name != 'pull_request' && 'runner-group' || '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install dependencies
        run: python3 -m pip install requests==2.32.3 PyYAML==6.0.2

      - name: Reconcile release runner groups
        env:
          RUNNER_GROUP_TOKEN: ${{ secrets.RUNNER_GROUP_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          SHOULD_APPLY: ${{ github.event_name == 'push' || inputs.apply }}
        run: |
          # --self-allow: this repository runs no release build of its own, so
          # discovery finds nothing here. The reusable is named explicitly and
          # allow-listed at main and every release/X.Y branch, because a caller
          # pins whichever ref it likes.
          SCRIPT=tools/scripts/release_manage_runner_groups.py
          ARGS=(--repo "${GITHUB_REPOSITORY}"
                --self-allow .github/workflows/build_wheels_linux.yml)
          if [ "${SHOULD_APPLY}" = "true" ]; then
            python3 "${SCRIPT}" "${ARGS[@]}" --apply
          else
            python3 "${SCRIPT}" "${ARGS[@]}"
          fi
