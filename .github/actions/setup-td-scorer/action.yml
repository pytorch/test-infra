name: Set up the TD scorer
description: Python 3.11 with tools/torchci and its requirements installed, from a test-infra checkout

runs:
  using: composite
  steps:
    - name: Set up python 3.11
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.11'

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install -r tools/torchci/requirements.txt
        python -m pip install -e tools/torchci
