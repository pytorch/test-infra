# Rules for matching logs against.
# The rules are ordered by priority, first rule being the highest priority.

# Guidelines for writing rules:
# - Use a raw string literal ('single-quote') to avoid having to escape
#   characters, or a multi-line string literal ('''triple-quote''') if your
#   string has a single-quote character inside it.
# - Start with ^ if you can, it makes filtering out non-matching lines faster.
# - Try to make sure the produced "captures" field is useful:
#   - It should have enough information to identify the failure.
#   - It should be groupable; e.g. there should be no random noise in the capture group.
# - If no capture groups are specified, the "captures" field is the whole match.
# - Try to match against as much information as possible, so that captures are interesting.
#     For example, instead of 'error: ', do 'error: .*'
# - You can use capture groups to filter out line noise, so that we can aggregate on captures.
#     For example, for the failure 'FAIL [10.2s]: test_foo', 'test_foo' is a
#     good capture group, as it filters out test timings which might be
#     variable.
# NB: check_forward_backward_compatibility.py emits this through a logging
# formatter that prepends '[WARNING <timestamp> <file>:<line>] ', so the
# message no longer starts at column 0. Keep the capture group to just the
# stable sentence so captures stay groupable (no timestamps).
[[rule]]
name = 'Operator backwards compatibility'
pattern = '^(?:\[WARNING [^\]]+\] )?(The PR is introducing backward incompatible changes to the operator library\.)'

# Emitted by test_forward_backward_compatibility() in pytorch's .ci/pytorch/test.sh
# when the torchscript model load checks fail.
[[rule]]
name = 'Forward/backward compatibility check failed'
pattern = '^(?:FC|BC) check failed: .*'

[[rule]]
name = 'Failed graph_break_registry check'
pattern = '^Found the unimplemented_v2 or unimplemented_v2_with_warning calls below that don.t match the registry in graph_break_registry.json.'

[[rule]]
name = 'Lintrunner failure'
pattern = '^>>> Lint for.*'

[[rule]]
name = 'GHA timeout'
pattern = '^##\[error\]The action (.*)has timed out(?: after .* minutes|)?.'

[[rule]]
name = 'Faulty ROCM runner'
pattern = '^Error: .*[dD]etect.*GPUs on the runner'

[[rule]]
name = 'GHA cancellation'
pattern = 'The runner has received a shutdown signal. This can happen when the runner service is stopped, or a manually started runner is canceled.'

[[rule]]
name = 'GHA job was cancelled'
pattern = '^##\[error\]The operation was canceled.'

[[rule]]
name = 'Runner disk space issue'
pattern = '^Failure: There is only .+ free space left in .+, which is less than the minimum requirement of'

[[rule]]
name = 'make build failure'
pattern = '''^Makefile:\d+: recipe for target '.+' failed'''

[[rule]]
name = 'bazel build failure'
pattern = '^Target //:\w+ failed to build'

# pip/build backend failed to build a wheel (e.g. torchcomms). Capture the package
# name; without this the line is unmatched (the bazel-specific ERROR rule requires
# bazel keywords).
[[rule]]
name = 'pip wheel build failure'
pattern = '^\s*ERROR: Failed building wheel for (\S+)'

[[rule]]
name = 'gtest failure'
pattern = '(^\[  FAILED  \].*) \(\d+'

[[rule]]
name = 'No trailing spaces'
pattern = '^The above lines have trailing spaces; please remove them'

[[rule]]
name = '''GitHub workflows weren't regenerated'''
pattern = '^As shown by the above diff, the committed \.github/workflows'

[[rule]]
name = 'Docker image push failure'
pattern = '''^name unknown: The repository with name '.*' does not exist in the registry'''

[[rule]]
name = 'Windows PyLong API usage check'
pattern = '^Usage of PyLong_\{From,As\}\{Unsigned\}Long API may lead to overflow errors on Windows'

[[rule]]
name = 'Bazel build failure (specific)'
pattern = '^ERROR: (.*(?:bazel|WORKSPACE|target).*)'

[[rule]]
name = 'Bazel build failure'
pattern = '^FAILED: Build did NOT complete successfully'

# Emitted by run_test.py when a test file's class forgets to subclass
# common_utils.TestCase; the real cause, but it prints early and the generic
# "distributed/... failed!" run_test.py wrapper line would otherwise win.
# Capture just the class name so it groups across runs.
[[rule]]
name = 'Test class does not extend TestCase'
pattern = '''^(\S+) - failed\. This test class should extend from .*TestCase but it doesn't\.'''

[[rule]]
name = 'Python unittest failure'
pattern = '^FAILED CONSISTENTLY: (.*)$'

[[rule]]
name = 'Python unittest failure'
pattern = 'FAIL(?: \[.*\])?: (test.*) \((?:__main__\.)?(.*)\)'

[[rule]]
name = 'Python unittest unexpected success'
pattern = 'XPASS(?: \[.*\])?: (test.*) \((?:__main__\.)?(.*)\)'

[[rule]]
name = 'pytest failure'
pattern = '^(?:FAILED|SUBFAIL) (?:\[.*s\] )?(\S*.py::\S*::test_\S*)'

[[rule]]
name = 'Python unittest error'
pattern = 'ERROR(?: \[.*\])?: (test.*) \((?:__main__\.)?(.*)\)'

[[rule]]
name = 'pytest test error'
pattern = '^ERROR (?:\[.*s\] )?(\S*.py::\S*::test_\S*)'

[[rule]]
name = 'Fallback for other test failure rules'
pattern = '^The following tests failed consistently: \[(.*)\]$'

[[rule]]
name = 'xla cpp test failure'
pattern = 'Build completed, \d+ test FAILED, \d+ total actions'

# Inductor benchmark per-model result. Group 1 is the model; keep group 2 to the
# stable failure KIND (e.g. "FAIL:  graph_breaks") and let the trailing "=N,
# expected=N" counts fall outside the capture so a model's regression doesn't
# scatter by count.
[[rule]]
name = 'inductor model failure'
pattern = '^([a-zA-Z0-9_]+) +(fail_accuracy|fail_to_run|eager_variation|infra_error|0\.0000|(?:FAIL|IMPROVED): +[a-z_]+).*$'

[[rule]]
name = 'NVIDIA installation failure'
pattern = '^ERROR: Installation has failed.*?nvidia'

[[rule]]
name = 'failed to download github artifacts'
pattern = 'List Artifacts failed:.*'

[[rule]]
name = 'MSVC out of memory'
pattern = 'Catastrophic error: .*'

[[rule]]
name = 'MSVC compiler error'
pattern = '^.*\(\d+\): error C\d+:.*'

[[rule]]
name = 'MSVC compiler fatal'
pattern = '^.*\(\d+\): fatal error C\d+:.*'

[[rule]]
name = 'Compile error'
pattern = '^.*\d+:\d+: error: .*'

[[rule]]
name = 'MSVC mt.exe manifest error'
pattern = '^mt.exe : general error c101008d: Failed to write the updated manifest to the resource of file'

[[rule]]
name = 'Curl error'
pattern = 'curl: .* error:'

[[rule]]
name = 'Dirty checkout'
pattern = '^Build left local git repository checkout dirty'

[[rule]]
name = 'Docker manifest error'
pattern = '''^ERROR: Something has gone wrong and the previous image isn't available for the merge-base of your branch'''

[[rule]]
name = 'flake8 error'
pattern = '^.*:\d+:\d: [EBFW]\d+ .*'

[[rule]]
name = 'apt-get update failure'
pattern = '^E: Failed to fetch.*'

[[rule]]
name = 'Dependency fetch error'
pattern = '^Error downloading packages:'

[[rule]]
name = 'ASAN LD_PRELOAD failure'
pattern = '^ERROR: ld.so: object .+ from LD_PRELOAD cannot be preloaded'

[[rule]]
name = 'ASAN failure'
pattern = '^ERROR: AddressSanitizer'

[[rule]]
name = 'undefined reference linker error'
pattern = 'undefined reference to .*'

[[rule]]
name = "Python Test SIG Code"
pattern = '^.*(Received Signal: SIG.*)'

[[rule]]
name = 'Library not loaded'
pattern = 'Library not loaded: .*$'

[[rule]]
name = 'Bad response status code'
pattern = '^##\[error\]Response status code does not indicate success: .*$'

[[rule]]
name = 'Python Test timeout (KeyboardInterrupt)'
pattern = '!+ KeyboardInterrupt !+'

# run_test.py's per-file summary ("<file> <shard>/<nshards> failed!", sometimes
# with a RuntimeError: prefix). Capture just the file so the shard index and the
# optional prefix don't scatter the same file across groups.
[[rule]]
name = 'Python Test File RuntimeError'
pattern = '^(?:RuntimeError: )?(\S*test\S*)(?: \d+/\d+)? failed!'

[[rule]]
name = 'CUDA out of memory error'
pattern = '^RuntimeError: CUDA out of memory.'

# Same failure surfaced as the torch.OutOfMemoryError class rather than
# RuntimeError; the rule above (and the generic Python-error rules) miss it.
# Capture the stable phrase, dropping the per-run GiB/GPU numbers.
[[rule]]
name = 'CUDA out of memory (torch.OutOfMemoryError)'
pattern = '^torch\.OutOfMemoryError: (CUDA out of memory)\.'

[[rule]]
name = 'Python AttributeError'
pattern = '^AttributeError: .*'

[[rule]]
name = 'File level retry'
pattern = '^Got exit code -.*, retrying \(retries left=.*\)$'

[[rule]]
name = 'Python flaky unittest - failed'
pattern = '^\s*(test.*) failed - num_retries_left:'

[[rule]]
name = 'Python flaky unittest - errored'
pattern = '^\s*(test.*) errored - num_retries_left:'

[[rule]]
name = 'pr_time_benchmarks regression'
pattern = '^(REGRESSION|MISSING REGRESSION TEST): benchmark.*'

# ghstack/merge infra errors that otherwise fall into the generic Python
# RuntimeError rule below, which bakes the per-run PR number / revision sha /
# branch name into the whole-line capture (every occurrence its own group).
# Capture the stable phrase instead.
[[rule]]
name = 'ghstack PR out of sync'
pattern = '^RuntimeError: PR \d+ (is out of sync with the corresponding revision)'

[[rule]]
name = 'ghstack git command failed'
pattern = '^RuntimeError: Command `git .*(cherry-pick|diff|rebase|merge|apply).*` returned non-zero exit code'

# filter_test_configs.py refuses CI on a too-deep ghstack; a plain INFO line (no
# ##[error]) that otherwise leaves the job — and ~23 fanned-out jobs per stack —
# classified as nothing. Drop the PR number from the capture.
[[rule]]
name = 'ghstack too deep - refusing to run CI'
pattern = '^PR #\d+ (sits on top of >=\d+ ghstack entries; refusing to run CI)'

[[rule]]
name = 'Python RuntimeError'
pattern = '^RuntimeError: .*'

[[rule]]
name = 'Python ModuleNotFoundError'
pattern = '^ModuleNotFoundError: .*'

[[rule]]
name = 'Python ImportError'
pattern = '^ImportError: .*'

[[rule]]
name = 'Python ValueErrors'
pattern = '^ValueError: .*'

[[rule]]
name = 'Python TypeErrors'
pattern = '^TypeError: .*'

# TODO (huydhn): Update ET test script to include the model name in the error message
[[rule]]
name = 'ExecuTorch portable model test - failed'
pattern = 'Portable fp32 error'

[[rule]]
name = 'ExecuTorch quantized portable model test - failed'
pattern = 'Portable q8 error'

[[rule]]
name = 'ExecuTorch delegation model test - failed'
pattern = 'Delegation fp32 error'

[[rule]]
name = 'ExecuTorch quantized delegation model test - failed'
pattern = 'Delegation q8 error'

[[rule]]
name = 'Docker login failure'
pattern = '''Docker login for '.*' failed.*'''

[[rule]]
name = 'conda failure'
pattern = 'An unexpected error has occurred. Conda has prepared the above report.'

[[rule]]
name = 'Docker error'
pattern = '^docker: Error.*'

# ninja's per-edge failure marker, printed immediately before the failing command
# and its error output -- so surfacing it lands the real cause in the context
# window regardless of error type (compile error, missing tool, linker). Match the
# modern `[code=N]` form (ninja-specific, so no floating-string overmatch) and
# capture just the exit code (127=command not found, 1=command failed, ...) so the
# group key stays stable instead of the variable target path. More specific error
# rules above still win; the "ninja: build stopped" rollup below is the last resort.
[[rule]]
name = 'ninja build step failed'
pattern = '^FAILED: \[(code=\d+)\]'

[[rule]]
name = 'Build error'
pattern = 'ninja: build stopped: subcommand failed'

[[rule]]
name = 'sccache error'
pattern = '^sccache: error: .*'

[[rule]]
name = 'Docker daemon error'
pattern = '^Error response from daemon: .*'

[[rule]]
name = 'Out of space error'
pattern = 'no space left on device'

[[rule]]
name = 'New graph breaks'
pattern = 'FAIL:\s+graph_breaks='

[[rule]]
name = 'Improved graph breaks'
pattern = 'IMPROVED:\s+graph_breaks='

[[rule]]
name = 'npm error'
pattern = '^npm ERR! code .*'

# pr-sanity-check.sh fails a too-large PR with this message and then just exits
# 1 (the exit-code line is stripped as boilerplate), so without this rule the job
# classifies as nothing. Capture drops the variable LOC count to stay groupable.
[[rule]]
name = 'PR exceeds maximum size'
pattern = '^Your PR is \d+ (LOC which is more than the \d+ maximum)$'

[[rule]]
name = 'No release notes label'
pattern = '^# This PR needs a `release notes:` label.*'

[[rule]]
name = 'ghstack merge check error'
pattern = '^Mergeability Error: .*'

[[rule]]
name = 'New modules are not documented correctly'
pattern = 'You added the following module\(s\) to the PyTorch namespace .* but they'

# A small utility job (runner-determinator, collect_env, …) whose only output is a
# GitHub REST API 403 body: the API rate limit was hit. User ID / request ID vary
# per run, so capture just the stable phrase; otherwise these classify as nothing.
[[rule]]
name = 'GitHub API rate limit exceeded'
pattern = '(API rate limit exceeded) for user ID \d+'

# Runner-side infra failure: the pod backing a self-hosted runner never came
# online. The pod name is random per run, so capture only the stable phase +
# reason tail ("Pending: backoff timeout") to keep it groupable. Must beat the
# generic GHA-error fallback below.
[[rule]]
name = 'Runner pod failed to come online'
pattern = '^##\[error\]Error: pod failed to come online with error:.*is unhealthy with phase status (.*)$'

# A downstream job couldn't fetch a build artifact because the upstream build
# failed to produce it. The artifact name (py version / cuda / arch) varies per
# job, so without this the generic GHA-error fallback captures the whole line and
# every occurrence lands in its own group. Capture only the stable prefix so all
# of these aggregate together.
[[rule]]
name = 'Artifact download failure'
pattern = '^##\[error\](Unable to download artifact\(s\): Artifact not found) for name:'

# GitHub couldn't fetch a repo/action tarball from codeload; the URL carries a
# commit hash, so the generic fallback scatters every occurrence. Capture the
# stable phrase only.
[[rule]]
name = 'Action archive download failure'
pattern = '''^##\[error\](Failed to download archive) '.*' after \d+ attempts'''

# S3 authorization failure on artifact upload; the ARN, resource path and job-id'd
# object key all vary per run, so capture only the denied action (e.g. s3:PutObject).
[[rule]]
name = 'S3 access denied'
pattern = '^##\[error\]User: .* is not authorized to perform: (s3:\w+)'

[[rule]]
name = 'GHA error'
pattern = '^##\[error\](.*)'
