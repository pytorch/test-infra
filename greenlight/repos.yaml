# The repos GreenLight serves and how. Format, validation and modes: REPOS.md.
repos:
  - repo: pytorch/pytorch
    status_comment: drci  # drci | greenlight
    safety: pytorchbot  # pytorchbot | gate
    eligibility: merge_rules  # merge_rules | write_permission
    mode: active  # shadow | active | off
    change_source: clickhouse  # github | clickhouse
  - repo: pytorch/test-infra
    status_comment: greenlight  # drci | greenlight
    safety: gate  # pytorchbot | gate
    eligibility: write_permission  # merge_rules | write_permission
    mode: shadow  # shadow | active | off
