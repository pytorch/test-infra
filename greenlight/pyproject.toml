[project]
name = "greenlight"
version = "0.0.0"
description = "CLI-invoked periodic iteration service, daemon-capable."
requires-python = ">=3.13,<3.14"
dependencies = ["pygithub>=2.6.1", "clickhouse-connect>=0.10", "pyyaml>=6", "boto3>=1.34"]

[project.scripts]
greenlight = "greenlight.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/greenlight"]

[dependency-groups]
dev = ["ruff", "mypy", "pytest", "pytest-cov", "pytest-xdist", "yamllint", "types-PyYAML"]

[tool.uv]
python-preference = "only-system"

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "UP",
  "B",
  "SIM",
  "RUF",
  "S",
  "T20",
  "PIE",
  "C4",
  "PT",
  "RSE",
  "RET",
  "TCH",
  "ARG",
  "ERA",
]
ignore = ["RET504"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ARG", "PT011"]
# The detector hook lives outside this project root; ruff anchors per-file-ignore globs to the
# config directory, so the path is written relative to it (a bare "**/..." glob would never
# match a sibling tree). T20: the detector is a standalone CLI that prints to stdout/stderr by
# design.
"../.claude/hooks/greenlight/*.py" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["greenlight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
markers = ["slow: slow tests"]

[tool.coverage.run]
source = ["greenlight"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 97
show_missing = true
skip_covered = true
exclude_lines = [
  "if __name__ == .__main__.:",
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# boto3/botocore ship no inline types and their stubs are separate packages; the S3 put_object
# call is typed at the seam via a local Protocol and the client Config is a plain data object, so
# these module imports can be treated as untyped.
[[tool.mypy.overrides]]
module = ["boto3", "botocore.config"]
ignore_missing_imports = true
